<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏠 Dashboard | TrackRepost</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- ✅ Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="manifest" href="/images/site.webmanifest">
  <link rel="shortcut icon" href="/images/favicon.ico">

  <!-- ✅ Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- ✅ Firebase Config + Init -->
  <script src="/js/firebaseConfig.js"></script>
  <script src="/js/firebase-init.js"></script>

  <!-- ✅ Header + Dashboard Scripts -->
  <script type="module" src="/js/header.js"></script>
  <script src="/js/dashboard.js" defer></script>

  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }
    h1 {
      color: #ff9900;
      text-align: center;
    }
    .dashboard-info {
      text-align: center;
      margin-bottom: 30px;
    }
    .badge {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      display: inline-block;
      margin-top: 10px;
    }
    .badge.pro {
      background: #ff9900;
      color: black;
    }
    .badge.free {
      background: gray;
      color: white;
    }
    .campaign-card {
      background: #1c1c1c;
      padding: 20px;
      margin: 20px auto;
      border-radius: 10px;
      max-width: 600px;
      box-shadow: 0 0 10px rgba(255, 153, 0, 0.3);
    }
    .campaign-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
    }
    .button {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 20px;
      background-color: #ff9900;
      color: black;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
    .button:hover {
      background-color: #e88a00;
    }
    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <main>
    <h1>🏠 Dashboard</h1>

    <div class="dashboard-info">
      <h2 id="userInfo">Loading...</h2>
      <p id="creditBalance">Loading credits...</p>
      <div id="planBadge"></div>
      <button id="logout-btn" class="button" style="margin-top: 20px;">Log Out</button>
    </div>

    <div id="campaigns">
      <p style="text-align: center;">Loading your campaigns...</p>
    </div>
  </main>

  <footer>
    <p>© 2025 TrackRepost. All rights reserved.</p>
  </footer>
</body>
</html>
