<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Submit Campaign - TrackRepost</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- ✅ Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- ✅ Your Firebase Config -->
  <script src="/js/firebaseConfig.js"></script>
</head>
<body>
  <header>
    <h1>📢 Submit a Campaign</h1>
    <p>Welcome! You have <strong id="creditBalance">...</strong> credits.</p>
  </header>

  <main>
    <form id="campaignForm" class="campaign-form">
      <label for="trackUrl">SoundCloud Track URL</label>
      <input type="url" id="trackUrl" placeholder="https://soundcloud.com/artist/track" required />

      <label for="genre">Genre</label>
      <input type="text" id="genre" placeholder="e.g. Hip-Hop, EDM" required />

      <label for="credits">Credits to Spend</label>
      <input type="number" id="credits" placeholder="e.g. 500" min="1" required />

      <button type="submit" id="submitBtn">Submit Campaign</button>
    </form>
  </main>

  <footer>
    <p>🚀 TrackRepost – Launch your next hit</p>
  </footer>

  <!-- ✅ Submit Campaign Script -->
  <script src="/js/submit-campaign.js"></script>
</body>
</html>
