<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DJ News – TrackRepost</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon">

  <style>
    body {
      background-color: #0d0d0d;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #ffa500;
    }

    #news-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .news-card {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      border-left: 4px solid #ffa500;
    }

    .news-card a {
      color: #ffa500;
      text-decoration: none;
      font-weight: bold;
    }

    .news-card a:hover {
      text-decoration: underline;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-bottom: 20px;
      font-size: 1rem;
      color: #ffa500;
    }
  </style>
</head>
<body>

  <a class="back-link" href="dashboard.html">← Back to Dashboard</a>
  <h1>🔥 DJ & EDM News</h1>
  <div id="news-container">
    <p style="text-align:center;">Loading news...</p>
  </div>

  <script src="js/dj-news.js"></script>
</body>
</html>
