<script>
  const feeds = [
    "https://djmag.com/rss.xml",
    "https://mixmag.net/rss",
    "https://edm.com/.rss/full/",
    "https://www.edmidentity.com/feed/",
    "https://www.dancingastronaut.com/feed/",
    "https://ra.co/rss"
  ];

  async function loadNews() {
    const container = document.getElementById("news-container");

    for (const feed of feeds) {
      try {
        const url = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed)}`;
        const res = await fetch(url);
        const data = await res.json();

        if (!data.items) continue;

        data.items.forEach(article => {
          const card = document.createElement("div");
          card.className = "news-card";
          card.innerHTML = `
            <h3><a href="${article.link}" target="_blank">${article.title}</a></h3>
            <p>${article.description.substring(0, 250)}...</p>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error("Error loading feed:", feed, err);
      }
    }
  }

  loadNews();
</script>
