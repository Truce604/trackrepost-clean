<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buy Credits – TrackRepost</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- Firebase v8 SDK -->
  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script defer src="/js/firebaseConfig.js"></script>
</head>
<body>
  <header class="header">
    <h1 class="title">💳 Buy Credits</h1>
    <p class="subtitle">Your balance: <strong id="creditBalance">Loading...</strong> credits</p>
  </header>

  <main class="container">
    <div class="credit-options">
      <button class="credit-button" data-credits="500">500 credits – $24.99</button>
      <button class="credit-button" data-credits="1000">1,000 credits – $34.99</button>
      <button class="credit-button" data-credits="2500">2,500 credits – $79.99</button>
    </div>
  </main>

  <footer class="footer">
    <p>🚀 TrackRepost – Boost your music reach</p>
  </footer>

  <script>
    const FUNCTION_URL = "https://createcheckout-ialajpxs2q-uc.a.run.app";
    const PRICE_CENTS = {
      500: 2499,
      1000: 3499,
      2500: 7999
    };

    // Wait until Firebase is fully loaded (since we used defer)
    window.addEventListener("DOMContentLoaded", () => {
      const creditBalance = document.getElementById("creditBalance");

      firebase.auth().onAuthStateChanged(async user => {
        if (!user) {
          window.location.href = "index.html";
          return;
        }

        try {
          const snap = await firebase.firestore().collection("users").doc(user.uid).get();
          const credits = snap.exists ? snap.data().credits || 0 : 0;
          creditBalance.textContent = credits;
        } catch (err) {
          console.error("⚠️ Failed to fetch credits:", err);
          creditBalance.textContent = "Error";
        }
      });

      // ✅ Add click listeners after DOM is ready
      document.querySelectorAll(".credit-button").forEach(button => {
        button.addEventListener("click", async () => {
          const user = firebase.auth().currentUser;
          if (!user) return alert("You must be logged in.");

          const creditsToBuy = parseInt(button.dataset.credits);
          const amount = PRICE_CENTS[creditsToBuy];

          try {
            const res = await fetch(FUNCTION_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                amount,
                credits: creditsToBuy,
                userId: user.uid
              })
            });

            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              console.error("❌ Checkout error:", err);
              return alert("Something went wrong during checkout.");
            }

            const { checkoutUrl } = await res.json();
            window.location.href = checkoutUrl;
          } catch (err) {
            console.error("❌ Network error:", err);
            alert("Checkout server is unavailable.");
          }
        });
      });
    });
  </script>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background-color: #111;
      color: #fff;
      text-align: center;
    }

    .header {
      padding: 2rem 1rem 0;
    }

    .title {
      font-size: 2rem;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 1rem;
      color: #aaa;
    }

    .container {
      padding: 2rem 1rem;
    }

    .credit-options {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      max-width: 400px;
      margin: auto;
    }

    .credit-button {
      background: #f9a825;
      color: #111;
      font-size: 1.25rem;
      padding: 1rem 2rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .credit-button:hover {
      background: #ffc107;
    }

    .footer {
      padding: 2rem 1rem;
      font-size: 0.9rem;
      color: #666;
    }

    @media (min-width: 600px) {
      .credit-options {
        flex-direction: row;
        justify-content: center;
      }

      .credit-button {
        min-width: 200px;
      }
    }
  </style>
</body>
</html>
