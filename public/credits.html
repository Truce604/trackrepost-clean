<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buy Credits – TrackRepost</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- Firebase v8 Compat -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="/js/firebaseConfig.js"></script>
</head>
<body>
  <header>
    <h1>💳 Buy Credits</h1>
    <p>Your balance: <strong id="creditBalance">…</strong> credits</p>
  </header>

  <main>
    <div class="plans">
      <button data-credits="500">500 credits – $24.99</button>
      <button data-credits="1000">1,000 credits – $34.99</button>
      <button data-credits="2500">2,500 credits – $79.99</button>
    </div>
  </main>

  <footer>
    <p>TrackRepost.com — boost your music</p>
  </footer>

  <script>
    // ——— CONFIG ———
    const PRICE_CENTS = {
      500: 2499,
      1000: 3499,
      2500: 7999
    };
    const FUNCTION_URL = "https://createcheckout-ialajpxs2q-uc.a.run.app"; // ← your Gen2 URL

    // ——— AUTH & BALANCE ———
    firebase.auth().onAuthStateChanged(async user => {
      if (!user) return void (window.location.href = "index.html");

      const snap = await firebase.firestore().collection("users").doc(user.uid).get();
      const credits = snap.exists ? snap.data().credits || 0 : 0;
      document.getElementById("creditBalance").textContent = credits;
    });

    // ——— PURCHASE FLOW ———
    document.querySelectorAll("button[data-credits]").forEach(btn => {
      btn.addEventListener("click", () => buyCredits(parseInt(btn.dataset.credits)));
    });

    async function buyCredits(credits) {
      const user = firebase.auth().currentUser;
      if (!user) return alert("Please sign in first.");

      const amount = PRICE_CENTS[credits];
      try {
        const resp = await fetch(FUNCTION_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ amount, credits, userId: user.uid })
        });

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ status: resp.status }));
          console.error("⚠️ Invalid checkout response:", err);
          return alert("Error creating checkout. See console for details.");
        }

        const { checkoutUrl } = await resp.json();
        // redirect to Square checkout
        window.location.href = checkoutUrl;
      } catch (e) {
        console.error("❌ Checkout fetch error:", e);
        alert("Network error. Please try again later.");
      }
    }
  </script>
</body>
</html>
