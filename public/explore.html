<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎧 Explore Campaigns | TrackRepost</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- ✅ Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="manifest" href="/images/site.webmanifest">
  <link rel="shortcut icon" href="/images/favicon.ico">

  <!-- ✅ Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- ✅ Firebase Config + Init -->
  <script src="/js/firebaseConfig.js"></script>
  <script src="/js/firebase-init.js"></script>

  <!-- ✅ Header -->
  <script type="module" src="/js/header.js"></script>

  <!-- ✅ Explore Campaigns Logic -->
  <script src="/js/explore-campaigns.js" defer></script>

  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #ff9900;
      margin-bottom: 30px;
    }

    .campaign-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .campaign-card {
      background: #1c1c1c;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 0 10px rgba(255, 153, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .soundcloud-embed {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
    }

    .campaign-details {
      margin-top: 10px;
      text-align: center;
    }

    .campaign-details h3 {
      margin: 5px 0;
      font-size: 16px;
      color: #ff9900;
    }

    .campaign-details p {
      margin: 2px 0;
      font-size: 14px;
    }

    .repost-btn {
      margin-top: 10px;
      padding: 8px 14px;
      background-color: #ff9900;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
    }

    .repost-btn:hover {
      background-color: #e88a00;
    }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <main>
    <h1>🔥 Explore Tracks to Repost</h1>
    <div id="campaignList" class="campaign-grid">
      <p>Loading campaigns...</p>
    </div>
  </main>

  <footer style="text-align: center; margin-top: 30px;">
    <p>© 2025 TrackRepost. All rights reserved.</p>
  </footer>
</body>
</html>
