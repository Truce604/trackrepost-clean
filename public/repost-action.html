<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Repost Track</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="/images/favicon.png" type="image/png" />

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- Firebase Config + Init -->
  <script src="/js/firebaseConfig.js"></script>
  <script src="/js/firebase-init.js"></script>

  <!-- Header -->
  <script type="module" src="/js/header.js"></script>

  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      color: #ff9900;
    }

    #campaignInfo p, #message {
      margin: 8px 0;
    }

    textarea {
      width: 100%;
      max-width: 500px;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
    }

    button {
      background-color: #ff9900;
      color: white;
      font-weight: bold;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #e88a00;
    }

    #radioLoading img {
      animation: radio-spin 0.8s infinite alternate;
    }

    @keyframes radio-spin {
      from { transform: rotate(-5deg); }
      to { transform: rotate(5deg); }
    }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <div class="container">
    <h1 id="campaignTitle">Loading...</h1>
    <div id="campaignInfo"></div>

    <div id="repostActions" style="display:none;">
      <label><input type="checkbox" id="likeTrack" checked /> Like Track (1 credit)</label><br>
      <label><input type="checkbox" id="commentBoxToggle" /> Leave a Comment (2 credits)</label><br>
      <textarea id="commentText" style="display:none;" placeholder="Enter comment..."></textarea><br>
      <button id="submitRepost">✅ Confirm Repost</button>
    </div>

    <p id="message"></p>

    <!-- 🎛️ Radio Visual -->
    <div id="radioLoading" style="display:none; margin-top:20px;">
      <img src="/images/radio-dial.png" alt="Tuning..." style="width:50px;">
      <audio id="radioSound" src="/sounds/radio-static.wav" preload="auto"></audio>
    </div>
  </div>

  <script src="/js/repost-action.js"></script>
</body>
</html>
