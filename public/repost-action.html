
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repost Track - TrackRepost</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- Config & Init -->
  <script src="/js/firebaseConfig.js"></script>
  <script src="/js/firebase-init.js"></script>

  <!-- Header -->
  <script type="module" src="/js/header.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <main class="container" style="padding: 20px;">
    <h1>🎧 Repost Track</h1>
    <div id="campaignInfo">
      <p>Loading campaign...</p>
    </div>

    <div id="engagementOptions" style="margin-top: 20px;">
      <label><input type="checkbox" id="likeCheckbox" checked /> ❤️ Like (1 credit)</label><br>
      <label><input type="checkbox" id="followCheckbox" /> ➕ Follow Artist</label><br>
      <label>
        💬 Comment for 2 extra credits:<br>
        <textarea id="commentBox" rows="3" cols="50" placeholder="Nice track! 🔥"></textarea>
      </label><br><br>
      <button id="repostBtn">✅ Repost and Earn</button>
      <p id="repostStatus" style="margin-top: 12px;"></p>
    </div>
  </main>

  <footer>
    <p>© 2025 TrackRepost</p>
  </footer>

  <script src="/js/repost-action.js"></script>
</body>
</html>
