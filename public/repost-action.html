<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repost Track | TrackRepost</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="/images/favicon.png" type="image/png">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <h1 id="campaignTitle">🎵 Loading...</h1>

    <section id="campaignInfo" class="campaign-info">
      <p>Fetching campaign details...</p>
    </section>

    <section id="repostActions" style="display:none;">
      <div class="repost-options">
        <label>
          <input type="checkbox" id="likeTrack" checked />
          ❤️ Like this track (earn +1 credit)
        </label>

        <label>
          <input type="checkbox" id="commentBoxToggle" />
          💬 Leave a comment (earn +2 credits)
        </label>

        <textarea id="commentText" placeholder="Great track! 🔥" style="display:none;"></textarea>
      </div>

      <button id="submitRepost" class="button">📻 Repost This Track</button>
      <p id="message" class="success-message"></p>
    </section>

    <div id="radioLoading" style="display: none; text-align: center;">
      <img src="/images/radio.gif" alt="Loading..." width="100" />
    </div>
    <audio id="radioSound" src="/audio/radio-static.mp3" preload="auto"></audio>
  </main>

  <footer>
    <p>© 2025 TrackRepost. All rights reserved.</p>
  </footer>

  <!-- Firebase Config & Script -->
  <script type="module" src="/js/repost-action.js"></script>
  <script src="/js/header.js"></script>
</body>
</html>
