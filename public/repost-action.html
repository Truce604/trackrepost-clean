<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Repost Track</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="/images/favicon.png" type="image/png" />

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-functions.js"></script>

  <!-- Firebase Config & Init -->
  <script src="/js/firebaseConfig.js"></script>
  <script src="/js/firebase-init.js"></script>

  <!-- Header -->
  <script type="module" src="/js/header.js"></script>

  <style>
    @keyframes radio-spin {
      from { transform: rotate(-10deg); }
      to { transform: rotate(10deg); }
    }
    #commentText {
      width: 100%;
      height: 80px;
      margin-top: 10px;
    }
    #submitRepost {
      margin-top: 10px;
      padding: 10px 20px;
      font-weight: bold;
      border-radius: 6px;
      background-color: #ff9900;
      border: none;
      cursor: pointer;
    }
    #submitRepost:hover {
      background-color: #e88a00;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="campaignTitle">Loading...</h1>
    <div id="campaignInfo"></div>

    <div id="repostActions" style="display:none;">
      <label><input type="checkbox" id="likeTrack" checked /> Like Track (1 credit)</label><br>
      <label><input type="checkbox" id="commentBoxToggle" /> Leave a Comment (2 credits)</label><br>
      <textarea id="commentText" style="display:none;" placeholder="Enter comment..."></textarea><br>
      <button id="submitRepost">✅ Confirm Repost</button>
    </div>

    <p id="message"></p>

    <!-- 🎛️ Radio Visual -->
    <div id="radioLoading" style="display:none; margin-top:20px;">
      <img src="/images/radio-dial.png" alt="Tuning..." style="width:50px; animation: radio-spin 1s infinite alternate;">
      <audio id="radioSound" src="/sounds/radio-static.wav" preload="auto"></audio>
    </div>
  </div>

  <script src="/js/repost-action.js"></script>
</body>
</html>
