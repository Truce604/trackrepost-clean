<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎶 Repost Track | TrackRepost</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- ✅ Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="manifest" href="/images/site.webmanifest">
  <link rel="shortcut icon" href="/images/favicon.ico">

  <!-- ✅ Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- ✅ Firebase Config + Init -->
  <script src="/js/firebaseConfig.js"></script>
  <script src="/js/firebase-init.js"></script>

  <!-- ✅ Header -->
  <script type="module" src="/js/header.js"></script>

  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    textarea {
      width: 100%;
      min-height: 80px;
      margin-top: 10px;
      background: #1c1c1c;
      color: #fff;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 10px;
    }

    button {
      background-color: #ff9900;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }

    button:hover {
      background-color: #e88a00;
    }

    iframe {
      border-radius: 10px;
      margin-top: 10px;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
    }

    #radioLoading img {
      animation: radio-spin 0.6s infinite alternate;
    }

    @keyframes radio-spin {
      from { transform: rotate(-10deg); }
      to { transform: rotate(10deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="campaignTitle">Loading...</h1>
    <div id="campaignInfo"></div>

    <div id="repostActions" style="display:none;">
      <label><input type="checkbox" id="likeTrack" checked /> 👍 Like Track (1 credit)</label><br><br>
      <label><input type="checkbox" id="commentBoxToggle" /> 💬 Leave a Comment (2 credits)</label><br>
      <textarea id="commentText" style="display:none;" placeholder="Write your comment here..."></textarea><br>
      <button id="submitRepost">✅ Confirm Repost</button>
    </div>

    <p id="message"></p>

    <!-- 🎛️ Radio Visual -->
    <div id="radioLoading" style="display:none; margin-top:20px;">
      <img src="/images/radio-dial.png" alt="Tuning..." style="width:60px;">
      <audio id="radioSound" src="/sounds/radio-static.wav" preload="auto"></audio>
    </div>

    <!-- ✅ Required for repost-action.js -->
    <div id="repost-container" style="margin-top: 40px;"></div>
  </div>

  <!-- ✅ Repost Script -->
  <script type="module" src="/js/repost-action.js"></script>
</body>
</html>
